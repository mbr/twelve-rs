[package]
name = "twelve"
version = "0.4.3"
description = "Twelve-factor app utilities for axum"
repository = "https://github.com/mbr/twelve-rs"
documentation = "https://docs.rs/twelve"
readme = "README.md"
keywords = ["axum", "twelve-factor", "web"]
categories = ["web-programming::http-server"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.94"
include = [
  "/src/**/*",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE-APACHE",
  "/LICENSE-MIT",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
html = ["dep:html-escape"]
postgres = ["dep:sec", "dep:sqlx"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "tracing"] }
html-escape = { version = "0.2", optional = true }
sec = { version = "1.1", optional = true }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["migrate", "postgres", "runtime-tokio", "tls-rustls"], optional = true }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "signal"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "tracing-log"] }

[dev-dependencies]
sec = { version = "1.1", features = ["deserialize"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
